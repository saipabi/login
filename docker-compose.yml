version: '3.8'

services:
  # Web Application (PHP + Apache + Frontend)
  app:
    build: .
    ports:
      - "8080:80"
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASS=rootpassword
      - MYSQL_DB=auth_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB=auth_db
    depends_on:
      - mysql
      - redis
      - mongodb
    volumes:
      - .:/var/www/html

  # MySQL Database
  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: auth_db
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

  # Redis In-Memory Cache (Session Store)
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6380:6379"

  # MongoDB NoSQL Database (Profiles Store)
  mongodb:
    image: mongo:6.0
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mysql_data:
  mongo_data:
