<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuthPortal - Register</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gradient-primary min-vh-100 d-flex flex-column justify-content-center py-4">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
                
                <!-- Registration Card -->
                <div class="auth-card p-4 p-md-5">
                    
                    <div class="auth-header">
                        <div class="brand-icon-wrapper">
                            <i class="bi bi-person-plus-fill"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Create Account</h3>
                        <p class="text-muted small">Sign up to get started with AuthPortal</p>
                    </div>

                    <!-- Alert message notification -->
                    <div id="register-alert" class="alert alert-danger align-items-center" role="alert">
                        <i id="alert-icon" class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span id="alert-message"></span>
                    </div>

                    <!-- Registration Form (Handled via jQuery AJAX, not default submit) -->
                    <form id="register-form" novalidate>
                        
                        <!-- Full Name -->
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="reg-name" placeholder="John Doe" required autocomplete="name">
                            <label for="reg-name"><i class="bi bi-person me-2"></i>Full Name</label>
                            <div class="invalid-feedback">Please enter your full name.</div>
                        </div>

                        <!-- Email -->
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="reg-email" placeholder="name@example.com" required autocomplete="email">
                            <label for="reg-email"><i class="bi bi-envelope me-2"></i>Email Address</label>
                            <div class="invalid-feedback">Please enter a valid email address.</div>
                        </div>

                        <!-- Password -->
                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="reg-password" placeholder="Password" required autocomplete="new-password">
                            <label for="reg-password"><i class="bi bi-lock me-2"></i>Password (min. 6 chars)</label>
                            <div class="invalid-feedback">Password must be at least 6 characters.</div>
                        </div>

                        <!-- Confirm Password -->
                        <div class="form-floating mb-4">
                            <input type="password" class="form-control" id="reg-confirm-password" placeholder="Confirm Password" required autocomplete="new-password">
                            <label for="reg-confirm-password"><i class="bi bi-check2-circle me-2"></i>Confirm Password</label>
                            <div class="invalid-feedback">Passwords do not match.</div>
                        </div>

                        <!-- Terms Checkbox -->
                        <div class="form-check mb-4">
                            <input class="form-check-input" type="checkbox" id="reg-terms" required>
                            <label class="form-check-label small text-muted" for="reg-terms">
                                I agree to the <a href="#" class="text-decoration-none text-primary">Terms of Service</a> &amp; <a href="#" class="text-decoration-none text-primary">Privacy Policy</a>
                            </label>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" id="btn-register" class="btn btn-primary w-100 py-3 rounded-pill">
                            <span id="btn-text"><i class="bi bi-person-check-fill me-2"></i>Register Now</span>
                            <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                        </button>

                    </form>

                    <!-- Navigation to Login -->
                    <div class="text-center mt-4 pt-2 border-top">
                        <p class="small text-muted mb-0">
                            Already have an account? 
                            <a href="login.html" class="fw-semibold text-primary text-decoration-none">Sign In here</a>
                        </p>
                    </div>

                </div>

                <!-- Footer note -->
                <div class="text-center text-white-50 mt-3 small">
                    <a href="index.html" class="text-white-50 text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts: jQuery, Bootstrap, Custom JS in separate file -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
