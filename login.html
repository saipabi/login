<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuthPortal - Login</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gradient-primary min-vh-100 d-flex flex-column justify-content-center py-4">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
                
                <!-- Login Card -->
                <div class="auth-card p-4 p-md-5">
                    
                    <div class="auth-header">
                        <div class="brand-icon-wrapper">
                            <i class="bi bi-box-arrow-in-right"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Welcome Back</h3>
                        <p class="text-muted small">Enter your credentials to access your profile</p>
                    </div>

                    <!-- Alert message notification -->
                    <div id="login-alert" class="alert alert-danger align-items-center" role="alert">
                        <i id="alert-icon" class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span id="alert-message"></span>
                    </div>

                    <!-- Login Form (Handled via jQuery AJAX, not default submit) -->
                    <form id="login-form" novalidate>
                        
                        <!-- Email -->
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="login-email" placeholder="name@example.com" required autocomplete="email">
                            <label for="login-email"><i class="bi bi-envelope me-2"></i>Email Address</label>
                            <div class="invalid-feedback">Please enter your registered email.</div>
                        </div>

                        <!-- Password -->
                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="login-password" placeholder="Password" required autocomplete="current-password">
                            <label for="login-password"><i class="bi bi-lock me-2"></i>Password</label>
                            <div class="invalid-feedback">Please enter your password.</div>
                        </div>

                        <!-- Forgot / Helper -->
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="remember-me">
                                <label class="form-check-label small text-muted" for="remember-me">Remember email</label>
                            </div>
                            <span class="badge bg-light text-secondary border">Redis Session</span>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" id="btn-login" class="btn btn-primary w-100 py-3 rounded-pill">
                            <span id="btn-text"><i class="bi bi-box-arrow-in-right me-2"></i>Sign In</span>
                            <span id="btn-spinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                        </button>

                    </form>

                    <!-- Navigation to Register -->
                    <div class="text-center mt-4 pt-2 border-top">
                        <p class="small text-muted mb-0">
                            Don't have an account yet? 
                            <a href="register.html" class="fw-semibold text-primary text-decoration-none">Sign Up here</a>
                        </p>
                    </div>

                </div>

                <!-- Footer note -->
                <div class="text-center text-white-50 mt-3 small">
                    <a href="index.html" class="text-white-50 text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
                </div>

            </div>
        </div>
    </div>

    <!-- Scripts: jQuery, Bootstrap, Custom JS in separate file -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/login.js?v=2"></script>
</body>
</html>
